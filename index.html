<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14151A" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Predator Hunters" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="application/ld+json">

    </script>

    <!-- Full stylesheet inlined so the page is fully styled at first paint (no FOUC,
         no external CSS request). A NEWSROOM design system: masthead, headline-led
         layout, kickers/datelines/bylines, print rules. Dark + light, PH brand. -->
    <style>
/* Self-hosted fonts (no third-party request → CSP stays 'self'). */
@font-face{font-family:'Fraunces';font-style:normal;font-weight:400 600;font-display:swap;src:url('/fonts/fraunces.woff2') format('woff2');}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:400 500;font-display:swap;src:url('/fonts/fraunces-italic.woff2') format('woff2');}
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:400 700;font-display:swap;src:url('/fonts/hanken.woff2') format('woff2');}
@font-face{font-family:'Spline Sans Mono';font-style:normal;font-weight:400 600;font-display:swap;src:url('/fonts/spline.woff2') format('woff2');}

/* ===== TOKENS ===== dark "press at night" (default) + light "paper". Palette
   anchored on the PH brand red; warm near-black / warm newsprint, not navy. */
:root{
  --paper:#14151A; --paper-2:#1B1D23; --sunk:#0F1014;
  --ink:#F4F1EA; --ink-2:#C6C2B7; --muted:#8E897D; --faint:#5C584F;
  /* Dark-mode hairlines are DARK (not cream) so they never read as white lines;
     panels still separate via the paper/paper-2 contrast. Light mode overrides
     these to dark-on-light below. --rule-strong replaces the old bold cream
     accent rules (masthead/footer/section heads) with a quiet dark groove. */
  --rule:rgba(0,0,0,.45); --rule-2:rgba(0,0,0,.65); --rule-strong:rgba(0,0,0,.55);
  --red:#FF4438; --red-2:#E23029; --on-red:#FFFFFF;
  --tag:rgba(255,68,56,.14);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Spline Sans Mono',ui-monospace,Menlo,Consolas,monospace;
  --maxw:1240px; --gut:clamp(18px,4vw,52px);
  /* back-compat aliases (older pages' inline styles still use these names); they
     resolve to the new newsroom tokens, and re-resolve per theme automatically. */
  --head:var(--ink); --bg:var(--paper); --bg-2:var(--paper-2);
  --hair:var(--rule); --hair-strong:var(--rule-2);
  --display:var(--serif); --grad:var(--red); --grad-soft:var(--tag); --on-grad:var(--on-red);
  --green:var(--red); --green-2:var(--red); --green-glow:rgba(255,68,56,.45); --orange:var(--red); --sky:var(--muted);
  --readout-bg:var(--paper-2); --pill-bg:var(--paper-2); --card-bg:var(--paper-2);
  --cta-bg:var(--paper-2); --member-bg:var(--paper-2); --nav-bg:var(--paper);
  --r-sm:3px; --r-md:4px; --r-lg:4px; --r-xl:6px; --vignette:transparent;
}
html[data-theme="light"]{
  --paper:#F5F2EA; --paper-2:#FFFFFF; --sunk:#EEEAE0;
  --ink:#15171C; --ink-2:#34373E; --muted:#6C6860; --faint:#9B968B;
  --rule:rgba(20,22,28,.15); --rule-2:rgba(20,22,28,.28); --rule-strong:var(--ink);
  --red:#CF1A24; --red-2:#A8141D; --on-red:#FFFFFF;
  --tag:rgba(207,26,36,.10);
}

*{box-sizing:border-box;}
html{background:var(--paper);}
body{margin:0;}
.theme-root{min-height:100dvh;background:var(--paper);color:var(--ink-2);
  font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;transition:background .3s,color .3s;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
::selection{background:var(--red);color:var(--on-red);}
/* GDS-grade focus: thick, high-contrast, never removed. */
:focus-visible{outline:3px solid var(--red);outline-offset:2px;}
.skip-link{position:absolute;left:8px;top:-60px;z-index:200;background:var(--ink);color:var(--paper);
  padding:10px 16px;font-weight:700;font-size:.9rem;border-radius:2px;transition:top .15s;}
.skip-link:focus{top:8px;}
main:focus{outline:none;}

h1,h2,h3,h4{font-family:var(--serif);font-weight:400;color:var(--ink);margin:0;letter-spacing:-.018em;}
p{margin:0;}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 var(--gut);}

/* ===== KICKER / META ===== the newsroom's signature small-caps labels. */
.kicker,.eyebrow,.sec-index{font-family:var(--mono);font-size:.7rem;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--red);}
.byline,.dateline{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);}
.byline b{color:var(--ink-2);font-weight:600;}
.grad-text{color:var(--red);} /* brand emphasis (no gradient in the newsroom) */

/* ===== MASTHEAD ===== */
.masthead{position:sticky;top:0;z-index:50;background:var(--paper);
  border-bottom:3px solid var(--rule-strong);}
.mh-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 0 12px;}
.brand{display:inline-flex;align-items:center;gap:14px;min-width:0;}
.brand-logo{height:34px;width:auto;}
html[data-theme="light"] .brand-logo{background:#14151A;padding:5px 9px;border-radius:4px;}
.brand-tag{font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);padding-left:14px;border-left:1px solid var(--rule-2);}
.mh-right{display:inline-flex;align-items:center;gap:10px;}
.theme-toggle{width:42px;height:42px;border-radius:4px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);transition:.15s;}
.theme-toggle:hover{color:var(--ink);border-color:var(--ink);}
.theme-toggle svg{width:17px;height:17px;}
.theme-toggle .ic-moon{display:none;}
html[data-theme="light"] .theme-toggle .ic-sun{display:none;}
html[data-theme="light"] .theme-toggle .ic-moon{display:inline-flex;}
.mh-nav{display:flex;align-items:center;gap:26px;border-top:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
.mh-nav::-webkit-scrollbar{display:none;}
.mh-link{padding:13px 0;font-family:var(--sans);font-weight:600;font-size:.95rem;color:var(--ink-2);
  white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .15s;}
.mh-link:hover{color:var(--ink);}
.mh-link.on{color:var(--ink);border-bottom-color:var(--red);}
.mh-cta{margin-left:auto;}
.nav-burger{display:none;}

/* ===== BUTTONS ===== flat, rectangular, high-contrast. */
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--sans);font-weight:600;
  font-size:.95rem;padding:12px 20px;border-radius:3px;cursor:pointer;border:1px solid transparent;
  transition:background .15s,border-color .15s,color .15s,transform .1s;}
.btn svg{width:16px;height:16px;}
.btn span{display:inline-flex;align-items:center;}
.btn-primary{background:var(--red);color:var(--on-red);}
.btn-primary:hover{background:var(--red-2);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--rule-2);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-ghost .ic{color:var(--red);}
.btn-sm{padding:8px 14px;font-size:.86rem;}

/* ===== SECTIONS / DIVIDERS ===== */
.section{padding:clamp(40px,6vh,72px) 0;}
.section-label{display:flex;align-items:center;gap:16px;margin-bottom:26px;}
.section-label .sec-index{flex:none;}
.section-label::after{content:"";flex:1;height:1px;background:var(--rule-2);}
.sec-head{margin-bottom:28px;}
.sec-head h2{font-size:clamp(1.6rem,3vw,2.4rem);line-height:1.08;margin-top:10px;}
.sec-head .lede{margin-top:10px;}
.lede{font-family:var(--sans);font-size:clamp(1.02rem,1.3vw,1.2rem);line-height:1.55;color:var(--ink-2);max-width:62ch;}

/* ===== FRONT PAGE ===== */
.front{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:clamp(28px,4vw,56px);}
.lead{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:30px;}
.lead .hl{font-size:clamp(2.1rem,4.4vw,3.6rem);line-height:1.02;margin:14px 0 0;}
.lead .standfirst{margin-top:16px;}
.lead .byline{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.lead .byline .sep{color:var(--red);}
.hl{font-family:var(--serif);color:var(--ink);letter-spacing:-.02em;line-height:1.06;}
.standfirst{font-family:var(--sans);font-size:clamp(1.04rem,1.4vw,1.28rem);line-height:1.55;color:var(--ink-2);}
.front-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;}
.story{padding:24px 0;border-top:1px solid var(--rule);}
.story:nth-child(odd){padding-right:clamp(0px,2vw,28px);}
.story:nth-child(even){padding-left:clamp(0px,2vw,28px);border-left:1px solid var(--rule);}
.story .hl{font-size:clamp(1.2rem,1.7vw,1.5rem);margin:10px 0 8px;transition:color .15s;}
.story:hover .hl{color:var(--red);}
.story p{font-size:.96rem;line-height:1.55;color:var(--ink-2);}
.story .byline{margin-top:12px;}

/* rail */
.rail{align-self:start;}
.rail + .rail{margin-top:34px;}
.rail-list{list-style:none;margin:0;padding:0;border-top:2px solid var(--rule-strong);}
.rail-item{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--rule);align-items:baseline;}
.rail-item:hover .hl{color:var(--red);}
.rail-item .n{font-family:var(--serif);font-size:1.5rem;line-height:1;color:var(--red);flex:none;width:24px;}
.rail-item .hl{font-size:1.04rem;line-height:1.25;}
.rail-note{border:1px solid var(--rule-2);border-radius:4px;padding:20px;background:var(--paper-2);}
.rail-note h4{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:10px;}
.rail-note p{font-size:.92rem;line-height:1.6;color:var(--ink-2);}

/* ===== NEWS FRONT: hero lead + image card grid ===== */
.hero-lead{display:grid;grid-template-columns:1.55fr 1fr;gap:clamp(20px,3vw,44px);align-items:center;
  padding:clamp(18px,3vh,34px) 0 clamp(26px,4vh,44px);border-bottom:2px solid var(--rule-strong);margin-bottom:clamp(26px,4vh,44px);}
.hero-lead .media{aspect-ratio:16/10;margin:0;}
.hero-lead .hl{font-size:clamp(1.9rem,3.7vw,3.3rem);line-height:1.03;margin:14px 0 0;}
.hero-lead .standfirst{margin-top:14px;}
.hero-lead .byline{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.hero-lead .byline .sep{color:var(--red);}
.hero-lead:hover .hl{color:var(--red);}
@media(max-width:840px){.hero-lead{grid-template-columns:1fr;gap:18px;}}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,2.2vw,28px);}
.ncard{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px;overflow:hidden;
  background:var(--paper-2);transition:transform .15s,border-color .15s,box-shadow .15s;}
.ncard:hover{transform:translateY(-3px);border-color:var(--rule-2);box-shadow:0 22px 44px -30px rgba(0,0,0,.55);}
.ncard:hover .hl{color:var(--red);}
.ncard .media{aspect-ratio:16/9;border-radius:0;border:0;border-bottom:1px solid var(--rule);}
.ncard .ncard-body{padding:15px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1;}
.ncard .hl{font-size:1.2rem;line-height:1.16;}
.ncard p{font-size:.93rem;line-height:1.5;color:var(--ink-2);}
.ncard .byline{margin-top:auto;padding-top:4px;}
@media(max-width:840px){.cards{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.cards{grid-template-columns:1fr;}}

/* ===== HEADLINE LIST (news index, latest) ===== */
.research-list{border-top:2px solid var(--rule-strong);}
.r-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(16px,3vw,44px);
  align-items:start;padding:26px 4px;border-bottom:1px solid var(--rule);transition:background .15s;}
.r-row.has-img{grid-template-columns:200px minmax(0,1fr) auto;}
.r-row:hover{background:var(--sunk);}
.r-row:hover .hl,.r-row:hover h3{color:var(--red);}
.r-thumb{width:200px;aspect-ratio:16/10;object-fit:cover;border-radius:3px;border:1px solid var(--rule-2);}
.r-num{display:block;font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:9px;}
.r-title h3{font-size:clamp(1.25rem,2vw,1.6rem);line-height:1.12;margin-bottom:8px;}
.r-ic{display:none;}
.r-desc{color:var(--ink-2);font-size:.97rem;line-height:1.55;max-width:62ch;}
.r-meta{display:flex;flex-direction:column;align-items:flex-end;gap:10px;white-space:nowrap;}
.r-arrow{color:var(--muted);}
.r-arrow svg{width:20px;height:20px;}
.r-row:hover .r-arrow{color:var(--red);}
/* media on cards/lead/story */
.media{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;border:1px solid var(--rule-2);background:var(--sunk);}
.lead-media{margin-bottom:20px;}
.story-media{aspect-ratio:16/10;margin-bottom:14px;}
@media (max-width:680px){.r-row.has-img,.r-row{grid-template-columns:1fr;}.r-thumb{width:100%;}}

/* ===== CARDS ===== flat editorial boxes (no glow/gradient). */
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;}
.card{position:relative;border:1px solid var(--rule-2);border-radius:4px;background:var(--paper-2);
  padding:24px;transition:border-color .2s,transform .1s;}
a.card:hover,.card.reveal:hover{border-color:var(--ink);}
.card h3{font-size:1.2rem;line-height:1.2;margin-bottom:9px;}
.card p{font-size:.95rem;line-height:1.6;color:var(--ink-2);}
.card-ic{width:38px;height:38px;border-radius:3px;display:grid;place-items:center;margin-bottom:16px;
  color:var(--red);background:var(--tag);border:1px solid var(--rule-2);}
.card-ic svg{width:20px;height:20px;}

/* statement block (interior) */
.statement-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(24px,5vw,64px);align-items:start;}
.statement{font-family:var(--serif);font-size:clamp(1.6rem,3.2vw,2.6rem);line-height:1.18;color:var(--ink);max-width:20ch;}
.statement-aside p{font-size:1rem;line-height:1.7;}
.statement-aside p+p{margin-top:14px;}

/* ===== PAGE HEADER (interior routes) ===== */
.page-head{padding:clamp(40px,7vh,72px) 0 26px;border-bottom:1px solid var(--rule);margin-bottom:clamp(28px,4vh,44px);}
.page-head h1{font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.04;margin:12px 0 0;max-width:20ch;}
.page-head .lede{margin-top:16px;}

/* ===== PROSE / ARTICLE ===== */
.prose{max-width:42rem;}
.prose p{font-size:1.1rem;line-height:1.78;color:var(--ink-2);}
.prose p+p{margin-top:18px;}
.prose strong{color:var(--ink);font-weight:600;}
.prose a{color:inherit;border-bottom:2px solid var(--red);}
.prose a:hover{background:var(--tag);}
.prose em{font-style:italic;}
.prose h2{font-family:var(--serif);font-size:clamp(1.4rem,2.4vw,1.85rem);line-height:1.15;color:var(--ink);margin:34px 0 12px;letter-spacing:-.015em;}
.prose h3{font-family:var(--serif);font-size:1.3rem;line-height:1.2;color:var(--ink);margin:26px 0 10px;}
.prose ul,.prose ol{margin:14px 0;padding-left:1.3em;}
.prose ul+ul{margin-top:0;}              /* consecutive single-item bullets read as one list */
.prose li{font-size:1.1rem;line-height:1.7;color:var(--ink-2);margin:4px 0;}
.prose li::marker{color:var(--red);}
.prose blockquote{margin:22px 0;padding:6px 0 6px 20px;border-left:3px solid var(--red);font-family:var(--serif);font-style:italic;font-size:1.15rem;line-height:1.5;color:var(--ink);}
/* Drop cap is OPT-IN per paragraph (author marks a block with a leading "^ ",
   which renders <p class="dropcap">) — never applied to every paragraph. */
.prose p.dropcap::first-letter{font-family:var(--serif);float:left;font-size:3.4rem;line-height:.82;
  padding:6px 10px 0 0;color:var(--red);}

.deflist{border-top:2px solid var(--rule-strong);}
.def{display:grid;grid-template-columns:230px 1fr;gap:22px;padding:22px 4px;border-bottom:1px solid var(--rule);}
.def dt{font-family:var(--serif);font-size:1.12rem;color:var(--ink);}
.def dd{margin:0;color:var(--ink-2);font-size:.97rem;line-height:1.6;}

/* ===== FOOTER ===== */
.footer{border-top:3px solid var(--rule-strong);margin-top:40px;padding:48px 0 40px;}
.footer-top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px;}
.footer-blurb{max-width:38ch;color:var(--muted);font-size:.92rem;line-height:1.6;margin-top:14px;}
.footer h4{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin:0 0 14px;}
.footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
.footer ul a{color:var(--ink-2);font-size:.93rem;}
.footer ul a:hover{color:var(--red);}
.footer-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-top:40px;padding-top:22px;border-top:1px solid var(--rule);}
.footer-bottom p{color:var(--faint);font-size:.8rem;margin:0;}
.footer-bottom .legal{font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;color:var(--faint);max-width:64ch;}

/* ===== CTA ===== */
.cta{border:1px solid var(--rule-2);border-radius:4px;padding:clamp(32px,5vw,56px);text-align:center;background:var(--paper-2);}
.cta h2{font-size:clamp(1.7rem,3.4vw,2.8rem);line-height:1.08;}
.cta .lede{margin:16px auto 26px;}
.cta-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* ===== REVEAL (subtle, accessible) ===== */
.rise{opacity:0;transform:translateY(10px);animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;}
.d1{animation-delay:.04s;}.d2{animation-delay:.1s;}.d3{animation-delay:.16s;}.d4{animation-delay:.24s;}.d5{animation-delay:.32s;}
@keyframes rise{to{opacity:1;transform:translateY(0);}}
@supports (animation-timeline:view()){@media (prefers-reduced-motion:no-preference){
  .reveal{animation:rev linear both;animation-timeline:view();animation-range:entry 2% cover 16%;}
  @keyframes rev{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}.rise,.reveal{opacity:1!important;transform:none!important;}}

/* ===== RESPONSIVE ===== */
@media (max-width:900px){
  .front{grid-template-columns:1fr;}
  .rail{border-top:1px solid var(--rule);padding-top:24px;}
  .statement-grid{grid-template-columns:1fr;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .footer-top{grid-template-columns:1fr 1fr;}
  .def{grid-template-columns:1fr;gap:6px;}
}
@media (max-width:680px){
  .theme-root{font-size:16px;}
  .front-grid{grid-template-columns:1fr;}
  .story:nth-child(even){padding-left:0;border-left:0;}
  .story:nth-child(odd){padding-right:0;}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
  .r-row{grid-template-columns:1fr;gap:8px;}
  .r-arrow{display:none;}
  .footer-top{grid-template-columns:1fr;}
  .mh-cta{display:none;}
}

/* Logo fallback for imageless stories (e.g. announcements) — contain on a brand
   panel so the wordmark isn't cropped like a photo. */
.media.logo,.r-thumb.logo{object-fit:contain!important;background:var(--paper)!important;padding:14% 16%;}
html[data-theme="light"] .media.logo,html[data-theme="light"] .r-thumb.logo{background:#14151A!important;}

/* ===== Home front page: section nav + clusters + database teaser ===== */
.sec-nav{display:flex;flex-wrap:wrap;gap:8px;max-width:var(--maxw);margin:0 auto;padding:16px var(--gut) 0;}
.sec-chip{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule-2);border-radius:999px;padding:6px 14px;text-decoration:none;transition:.15s;}
.sec-chip:hover{border-color:var(--red);color:var(--ink);}
.sec-chip.db{border-color:var(--red);color:var(--red);}
.sec-chip.db:hover{background:var(--red);color:var(--on-red);}
button.sec-chip{background:none;cursor:pointer;}
.sec-chip.active{background:var(--red);color:var(--on-red);border-color:var(--red);}
.sec-chip.active:hover{color:var(--on-red);}
.sec-block{padding-top:clamp(18px,3vh,38px);padding-bottom:0;scroll-margin-top:96px;}
.sec-block .section-label{display:flex;align-items:center;justify-content:space-between;}
.sec-more{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap;}
.sec-more:hover{color:var(--red);}
.db-teaser{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:clamp(24px,4vw,40px);border:1px solid var(--rule-2);border-radius:8px;background:var(--paper-2);text-decoration:none;transition:.15s;}
.db-teaser:hover{border-color:var(--red);transform:translateY(-2px);}
.db-teaser .kicker{color:var(--red);}
.db-teaser h2{margin:6px 0 8px;}
.db-teaser p{color:var(--ink-2);max-width:64ch;}
.db-teaser-go{flex:none;width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--red);border:1px solid var(--rule-2);transition:.15s;}
.db-teaser:hover .db-teaser-go{background:var(--red);color:var(--on-red);border-color:var(--red);}
@media(max-width:640px){.db-teaser{flex-direction:column;align-items:flex-start;}}

/* ===== Leaflet map popup: a compact article preview card ===== */
.mappop-wrap .leaflet-popup-content-wrapper{background:var(--paper-2);color:var(--ink);border:1px solid var(--rule-2);border-radius:8px;box-shadow:0 18px 40px -18px rgba(0,0,0,.6);}
.mappop-wrap .leaflet-popup-content{margin:0;width:240px!important;}
.mappop-wrap .leaflet-popup-tip{background:var(--paper-2);border:1px solid var(--rule-2);}
.mappop-wrap a.leaflet-popup-close-button{color:var(--muted);}
.mappop{display:block;}
.mappop img{display:block;width:100%;height:120px;object-fit:cover;border-radius:8px 8px 0 0;background:var(--sunk);}
.mappop-b{padding:12px 14px 14px;}
.mappop-k{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:4px;}
.mappop-b strong{display:block;font-family:var(--serif);font-size:16px;line-height:1.2;color:var(--ink);}
.mappop-a{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;}
.mappop-b p{margin:8px 0 10px;font-size:13px;line-height:1.45;color:var(--ink-2);}
a.mappop-link{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--red);text-decoration:none;}
a.mappop-link:hover{text-decoration:underline;}

/* Public complaint form (on /standards) — submits into the desk inbox */
.complaint-form{margin-top:24px;max-width:680px;}
.cf-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.cf-row .cf-in{flex:1;min-width:200px;}
.cf-in{width:100%;box-sizing:border-box;background:var(--paper-2);border:1px solid var(--rule-2);border-radius:var(--r-md);color:var(--ink);font-family:var(--sans);font-size:15px;padding:12px 14px;}
.cf-in:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--tag);}
.cf-body{display:block;resize:vertical;font-family:var(--sans);line-height:1.5;}
.cf-err{color:var(--red);font-size:14px;margin:10px 0 0;}
.cf-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px;}

/* IMPRESS pre-publish checklist modal */
.modal-scrim{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{width:100%;max-width:480px;background:var(--paper-2);border:1px solid var(--rule-2);border-radius:var(--r-xl);padding:26px 26px 22px;box-shadow:0 30px 70px rgba(0,0,0,.5);}
.modal-title{font-family:var(--serif);font-size:21px;color:var(--ink);margin:6px 0 4px;}
.modal-check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--rule);font-size:14px;line-height:1.5;color:var(--ink-2);cursor:pointer;}
.modal-check input{margin-top:3px;flex:none;width:16px;height:16px;accent-color:var(--red);}
.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:18px;}

/* ===== /desk editorial console (its own chrome, theme-aware) ===== */
.desk-root{min-height:100vh;background:var(--sunk);color:var(--ink);font-family:var(--sans);}
.desk-loading{display:flex;min-height:100vh;align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:14px;}
.desk-login{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;}
.desk-card{width:100%;max-width:380px;background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r-xl);padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,.35);}
.desk-eyebrow{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);}
.desk-title{margin:6px 0 2px;font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;color:var(--ink);}
.desk-sub{margin:0 0 22px;color:var(--muted);font-size:14px;}
.desk-field{display:block;margin-bottom:16px;}
.desk-field span{display:block;margin-bottom:6px;font-size:13px;color:var(--ink-2);}
.desk-field input{width:100%;box-sizing:border-box;background:var(--sunk);border:1px solid var(--rule-2);border-radius:var(--r-md);color:var(--ink);font-size:15px;padding:11px 12px;font-family:var(--sans);}
.desk-field input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--tag);}
.desk-error{margin:0 0 14px;color:var(--red);font-size:13px;}
.desk-ok{margin:0 0 14px;color:#5fce8e;font-size:13px;}
.desk-btn{width:100%;cursor:pointer;background:var(--red);color:var(--on-red);border:0;border-radius:var(--r-md);font-family:var(--sans);font-weight:600;font-size:15px;padding:12px;transition:background .15s;}
.desk-btn:hover{background:var(--red-2);}
.desk-btn:disabled{opacity:.6;cursor:default;}
.desk-btn.ghost{width:auto;background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);padding:8px 16px;font-size:13px;}
.desk-btn.ghost:hover{background:var(--paper);color:var(--ink);}
.desk-forgot{display:inline-block;margin-top:16px;color:var(--muted);font-size:13px;text-decoration:underline;}
.desk-forgot:hover{color:var(--ink);}
.desk-top{border-bottom:1px solid var(--rule);background:var(--paper);}
.desk-top-in{max-width:var(--maxw);margin:0 auto;padding:22px var(--gut);display:flex;align-items:center;justify-content:space-between;gap:16px;}
.desk-h1{margin:4px 0 0;font-family:var(--serif);font-weight:600;font-size:24px;color:var(--ink);}
.desk-top-right{display:flex;align-items:center;gap:14px;}
.desk-role{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule-2);border-radius:999px;padding:4px 12px;}
.desk-main{max-width:var(--maxw);margin:0 auto;padding:28px var(--gut) 64px;}
.desk-panel{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;}
.desk-panel-head{display:flex;align-items:baseline;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--rule);}
.desk-panel-head h2{margin:0;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);}
.desk-count{font-family:var(--mono);font-size:12px;color:var(--muted);}
.desk-muted{color:var(--muted);}
.desk-table{width:100%;border-collapse:collapse;font-size:14px;}
.desk-table th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:12px 22px;border-bottom:1px solid var(--rule);}
.desk-table td{padding:14px 22px;border-bottom:1px solid var(--rule);vertical-align:top;}
.desk-table tr:last-child td{border-bottom:0;}
.desk-row-title{color:var(--ink);font-weight:500;}
.desk-tag{margin-left:8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:2px 6px;}
.desk-tag.ai{background:var(--tag);color:var(--red);}
.desk-state{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid var(--rule-2);color:var(--ink-2);}
.desk-state.s-published,.desk-state.s-corrected{background:rgba(56,180,108,.14);border-color:rgba(56,180,108,.4);color:#5fce8e;}
.desk-state.s-legal_review,.desk-state.s-editorial_review,.desk-state.s-submitted{background:rgba(230,170,40,.14);border-color:rgba(230,170,40,.4);color:#e6c455;}
.desk-state.s-retracted{background:var(--tag);border-color:var(--rule-2);color:var(--red);}
.desk-head-right{display:flex;align-items:center;gap:14px;}
.desk-filters{display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px 4px;}
.desk-fchip{cursor:pointer;background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);border-radius:999px;font-family:var(--sans);font-size:12px;padding:6px 12px;transition:.15s;}
.desk-fchip:hover{border-color:var(--red);color:var(--ink);}
.desk-fchip.on{background:var(--red);border-color:var(--red);color:var(--on-red);}
.desk-fchip.needs{border-color:var(--red);color:var(--red);font-weight:600;}
.desk-fchip.needs.on{color:var(--on-red);}
.desk-fcount{font-family:var(--mono);font-size:10px;opacity:.75;margin-left:2px;}
.desk-btn.sm{width:auto;padding:8px 14px;font-size:13px;}
.pad{padding:16px 22px;}
.desk-actions{display:flex;flex-wrap:wrap;gap:6px;}
.desk-act{cursor:pointer;background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);border-radius:var(--r-md);font-family:var(--sans);font-size:12px;padding:6px 11px;white-space:nowrap;transition:.15s;}
.desk-act:hover{border-color:var(--red);color:var(--ink);}
.desk-act.danger:hover{border-color:var(--red);color:var(--red);}
.desk-act:disabled{opacity:.5;cursor:default;}
/* Staff draft preview banner */
.preview-banner{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px var(--gut);background:var(--red);color:var(--on-red);}
.preview-tag{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:3px 10px;}
.preview-state{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
.preview-actions{margin-left:auto;display:flex;gap:16px;align-items:center;}
.preview-edit{color:var(--on-red);text-decoration:underline;font-size:13px;font-weight:600;}
.preview-back{color:var(--on-red);text-decoration:underline;font-size:13px;}

/* Writer-first draft editor (Ghost/Medium feel) */
.editor{padding:24px 26px 26px;border-bottom:1px solid var(--rule);background:var(--sunk);}
.editor-title{width:100%;box-sizing:border-box;background:transparent;border:0;outline:0;color:var(--ink);font-family:var(--serif);font-weight:600;font-size:clamp(22px,3.5vw,32px);line-height:1.15;padding:4px 0;}
.editor-title::placeholder{color:var(--faint);}
.editor-meta{display:flex;gap:22px;margin:14px 0 6px;flex-wrap:wrap;}
.editor-meta label{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.editor-meta select{background:var(--paper-2);border:1px solid var(--rule-2);border-radius:var(--r-md);color:var(--ink);font-family:var(--sans);font-size:13px;padding:7px 10px;text-transform:none;letter-spacing:0;}
.editor-sub{width:100%;box-sizing:border-box;background:transparent;border:0;border-top:1px solid var(--rule);outline:0;color:var(--ink-2);font-family:var(--sans);font-size:16px;padding:14px 0 12px;margin-top:8px;}
.editor-sub::placeholder{color:var(--faint);}
.editor-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:14px 0 8px;}
.tb{cursor:pointer;background:var(--paper-2);border:1px solid var(--rule-2);color:var(--ink-2);border-radius:var(--r-md);font-family:var(--sans);font-size:13px;min-width:34px;padding:6px 10px;transition:.15s;}
.tb:hover{border-color:var(--red);color:var(--ink);}
.tb.b{font-weight:700;}
.tb.i{font-style:italic;font-family:var(--serif);}
.editor-hint2{margin-left:8px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--muted);}
.editor-preview h2{font-family:var(--serif);font-size:20px;margin:6px 0 10px;color:var(--ink);}
.editor-preview ul{margin:0 0 12px;padding-left:20px;}
.md-figure{margin:18px 0;}
.md-figure img{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);background:var(--sunk);}
.editor-preview li{font-family:var(--serif);font-size:16px;line-height:1.6;color:var(--ink);}
.editor-split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.editor-body{width:100%;box-sizing:border-box;background:var(--paper-2);border:1px solid var(--rule-2);border-radius:var(--r-md);outline:0;color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.65;padding:16px 18px;resize:vertical;min-height:300px;}
.editor-preview{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-md);padding:16px 18px;min-height:300px;max-height:520px;overflow:auto;}
.editor-prev-label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.editor-preview p{font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--ink);margin:0 0 14px;}
.editor-prev-empty{color:var(--faint)!important;font-style:italic;}
/* Editor mode toggle (Visual ↔ Markdown) */
.editor-modebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:14px 0 8px;}
.em-tab{cursor:pointer;background:var(--paper-2);border:1px solid var(--rule-2);color:var(--ink-2);border-radius:var(--r-md);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;transition:.15s;}
.em-tab:hover{border-color:var(--red);color:var(--ink);}
.em-tab.on{background:var(--red);color:var(--on-red);border-color:var(--red);}
.editor-rich{margin:4px 0;}
.is-hidden{display:none!important;}
/* taino-edit WYSIWYG surface — themed via the same vars so light/dark adapt */
.taino-editor{min-height:320px;background:var(--paper-2);border:1px solid var(--rule-2);border-radius:var(--r-md);padding:16px 18px;color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.72;outline:0;}
.taino-editor:focus-within{border-color:var(--red);}
.taino-editor h1,.taino-editor h2,.taino-editor h3{font-family:var(--serif);color:var(--ink);line-height:1.2;margin:18px 0 8px;}
.taino-editor h1{font-size:1.6rem;}
.taino-editor h2{font-size:1.35rem;}
.taino-editor h3{font-size:1.15rem;}
.taino-editor p{margin:0 0 12px;}
.taino-editor ul,.taino-editor ol{margin:10px 0;padding-left:1.4em;}
.taino-editor li::marker{color:var(--red);}
.taino-editor a{color:var(--ink);border-bottom:2px solid var(--red);}
.taino-editor blockquote{margin:14px 0;padding-left:16px;border-left:3px solid var(--red);font-style:italic;}
.taino-editor code{font-family:var(--mono);font-size:.92em;background:var(--sunk);padding:1px 5px;border-radius:4px;}
.taino-editor pre{background:var(--sunk);padding:12px 14px;border-radius:6px;overflow:auto;}
.taino-editor pre code{background:none;padding:0;}
.taino-editor img{max-width:100%;height:auto;border-radius:4px;}
/* ===== /desk Intake — editorial triage queue ===== */
.intake-sources{font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;color:var(--muted);padding:0 14px 6px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;}
.intake-src{display:inline-flex;gap:5px;align-items:baseline;}
.intake-src-t{color:var(--faint);}
.intake-count{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:2px 14px 12px;}
.intake-empty{padding:28px 14px;color:var(--muted);font-style:italic;}
.intake-list{display:flex;flex-direction:column;gap:10px;padding:0 14px 16px;}
.intake-card{position:relative;background:var(--paper-2);border:1px solid var(--rule-2);border-left:3px solid var(--rule-2);border-radius:var(--r-md);padding:13px 16px;transition:border-color .15s;}
.intake-card:hover{border-color:var(--rule-strong);}
.intake-card.restricted{border-left-color:var(--red);}
.intake-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.intake-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.intake-cat{font-family:var(--mono);font-size:.6rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule-2);border-radius:999px;padding:3px 9px;}
.intake-warn{font-family:var(--mono);font-size:.64rem;letter-spacing:.03em;color:var(--red);font-weight:600;white-space:nowrap;}
.intake-meta{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;color:var(--muted);white-space:nowrap;}
.intake-status{font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule-2);border-radius:3px;padding:2px 6px;color:var(--ink-2);}
.intake-src-key{color:var(--ink-2);}
.intake-headline{display:block;font-family:var(--serif);font-size:1.1rem;line-height:1.28;color:var(--ink);text-decoration:none;margin:9px 0 0;cursor:pointer;}
.intake-headline:hover{color:var(--red);}
.intake-source-link{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;color:var(--muted);text-decoration:none;margin-top:10px;border-bottom:1px solid transparent;}
.intake-source-link:hover{color:var(--ink);border-bottom-color:var(--rule-strong);}
.intake-snippet{color:var(--ink-2);font-size:.9rem;line-height:1.5;margin:6px 0 0;max-width:74ch;}
.intake-imgnote{font-family:var(--mono);font-size:.66rem;color:var(--faint);margin:8px 0 0;}
.intake-promoted{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;color:var(--red);margin-top:9px;text-decoration:none;border-bottom:1px solid transparent;}
.intake-promoted:hover{border-bottom-color:var(--red);}
.intake-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;}
.intake-btn{cursor:pointer;background:var(--sunk);border:1px solid var(--rule-2);color:var(--ink-2);border-radius:var(--r-md);font-family:var(--mono);font-size:.67rem;letter-spacing:.07em;text-transform:uppercase;padding:7px 13px;transition:.15s;}
.intake-btn:hover:not(:disabled){border-color:var(--red);color:var(--ink);}
.intake-btn.primary{background:var(--red);color:var(--on-red);border-color:var(--red);}
.intake-btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--on-red);}
.intake-btn.ghost{background:none;color:var(--muted);}
.intake-btn:disabled{opacity:.5;cursor:default;}
.intake-step2{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:13px;padding:11px 13px;background:var(--sunk);border:1px solid var(--rule-2);border-radius:var(--r-md);animation:intake-rise .16s ease;}
.intake-step2-lead,.intake-step2-in{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
