name: site

# Build the Predator Hunters main-site image (predatorhunters.co.uk) in CI, push
# to GHCR, then have the EC2 box docker-PULL + run it via AWS SSM (same no-SSH
# pattern as the research site). The box only RUNS the prebuilt image.
#
# This container serves the SSG site over PLAIN HTTP on :8090. It joins the
# shared user-defined Docker network `ph-net`; TLS for the apex is terminated by
# the shared EDGE Caddy (the research-site container, also on `ph-net`, which owns
# :443 + the Let's Encrypt cert and reverse-proxies predatorhunters.co.uk to
# `ph-press:8090` over that network — NOT 127.0.0.1, which inside a bridge-mode
# container is the container itself). So this deploy needs no Cloudflare token and
# opens no new firewall port (the loopback publish is only for the healthz probe).
#
# Gated on the GitHub Environment `production`. Reuses the same deploy secrets/vars
# as the bulwark server + research site:
#   secret AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (ph-bulwark-deployer; ssm:SendCommand)
#   var    AWS_REGION         e.g. eu-west-2
#   var    AWS_INSTANCE_ID    the EC2 instance id (SSM-managed)
#
# ONE-TIME prerequisites (outside CI — see deploy/README.md):
#   * In THIS repo: create the `production` Environment + add the AWS secrets/vars above.
#   * Cloudflare: proxied A records `@` (apex) and `www` → box IP (35.179.110.106).
#   * Edge: the research Caddyfile gains a `predatorhunters.co.uk` block that
#     reverse-proxies to 127.0.0.1:8090 (shipped in child-safety deploy/research).

on:
  push:
    branches: [master]
    paths:
      - src/**
      - content/**
      - assets/**
      - deploy/**
      - index.html
      - Cargo.toml
      - Cargo.lock
      - Dioxus.toml
      - .github/workflows/site.yml
  workflow_dispatch: {}

concurrency:
  group: deploy-ph-press
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jordan-hall/ph-press

jobs:
  build-image:
    name: build + push ph-press image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the SSG bundle into a Caddy image
        run: |
          set -euo pipefail
          docker build -f deploy/Dockerfile \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
      - name: Smoke test — image runs + bundle is present
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE:${GITHUB_SHA}" caddy version
          docker run --rm --entrypoint sh "$IMAGE:${GITHUB_SHA}" -c 'test -f /srv/index.html && echo bundle-ok'
      - name: Push to GHCR
        run: |
          set -euo pipefail
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  deploy:
    name: redeploy ph-press via SSM (pull, no build, no SSH)
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials (scoped deploy user)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Redeploy via SSM Run Command
        env:
          IID: ${{ vars.AWS_INSTANCE_ID }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Editorial-admin credentials live ONLY in deploy config, never in the
          # repo/image. PH_ADMIN_PASS (secret) is OPTIONAL: if set it seeds the
          # first admin on the very first deploy and is then ignored on updates
          # (bootstrap is create-once). If UNSET, NO admin is seeded — a fresh
          # deploy is completed via the one-time /desk install screen (no default
          # password). NOTE: open setup means whoever first reaches /desk on a new
          # public instance claims the admin account; for a sensitive deploy, set
          # PH_ADMIN_PASS to pre-seed instead. To take over an existing account,
          # set repo var PH_ADMIN_RESET=1 for ONE deploy (with PH_ADMIN_PASS set),
          # then clear it back to 0.
          PH_ADMIN_USER: ${{ vars.PH_ADMIN_USER }}
          PH_ADMIN_PASS: ${{ secrets.PH_ADMIN_PASS }}
          PH_ADMIN_RESET: ${{ vars.PH_ADMIN_RESET }}
          # Recovery email for the admin account, linked on every deploy (idempotent)
          # so the /desk forgot-password flow can reach it. Not a secret.
          PH_ADMIN_EMAIL: ${{ vars.PH_ADMIN_EMAIL }}
          # Email delivery for password-reset links (Amazon SES via the instance
          # role). OFF unless PH_EMAIL_BACKEND=ses; PH_EMAIL_FROM must be an
          # SES-verified sender. Not secrets. Until set, the link is only logged.
          PH_EMAIL_BACKEND: ${{ vars.PH_EMAIL_BACKEND }}
          PH_EMAIL_FROM: ${{ vars.PH_EMAIL_FROM }}
          # Crawler (OFF unless PH_CRAWL_ENABLED=1). Feed override lists are
          # base64-wrapped (they contain | ; ? & = and spaces) like the password;
          # the container decodes them. With no override the crate uses its presets.
          PH_CRAWL_ENABLED: ${{ vars.PH_CRAWL_ENABLED }}
          PH_CRAWL_INTERVAL_SECS: ${{ vars.PH_CRAWL_INTERVAL_SECS }}
          PH_CRAWL_CASELAW_FEEDS: ${{ vars.PH_CRAWL_CASELAW_FEEDS }}
          PH_CRAWL_NEWS_FEEDS: ${{ vars.PH_CRAWL_NEWS_FEEDS }}
          PH_CRAWL_COURTWATCH_FEEDS: ${{ vars.PH_CRAWL_COURTWATCH_FEEDS }}
          # AI drafting on promote (OFF unless PH_AI_ENABLED=1). With PH_AI_BACKEND=bedrock
          # the container calls Amazon Bedrock using the EC2 INSTANCE ROLE over IMDS — no
          # keys in the container (needs the instance metadata hop limit set to 2). It only
          # needs AWS_REGION + the role's bedrock:InvokeModel. Falls back to the banner draft
          # if disabled or the call fails, so promote never breaks.
          PH_AI_ENABLED: ${{ vars.PH_AI_ENABLED }}
          PH_AI_BACKEND: ${{ vars.PH_AI_BACKEND }}
          PH_AI_MODEL: ${{ vars.PH_AI_MODEL }}
          # Litestream continuous backup to S3 (OFF unless PH_BACKUP_BUCKET is set).
          # The container uses the EC2 instance role for S3 access — no extra keys.
          PH_BACKUP_BUCKET: ${{ vars.PH_BACKUP_BUCKET }}
          DEPLOY_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          REF="${IMAGE}:${GITHUB_SHA}"
          # Default the optional knobs so an unset repo var doesn't break -e.
          PH_ADMIN_USER="${PH_ADMIN_USER:-admin}"
          PH_ADMIN_RESET="${PH_ADMIN_RESET:-0}"
          PH_ADMIN_EMAIL="${PH_ADMIN_EMAIL:-}"
          # SES email delivery (off unless backend set). Wrap the sender (may carry
          # a display name + spaces / < >) base64 like the password; the container
          # decodes PH_EMAIL_FROM_B64. Region defaults to AWS_REGION in the app.
          PH_EMAIL_BACKEND="${PH_EMAIL_BACKEND:-}"
          PH_EMAIL_FROM_B64="$(printf '%s' "${PH_EMAIL_FROM:-}" | base64 -w0)"
          # Base64-wrap the password: the SSM command is JSON-in-shell, so a raw
          # password containing ' " \ $ or newlines would break it. base64 is
          # [A-Za-z0-9+/=] only — safe through both layers; the container decodes.
          PH_ADMIN_PASS_B64="$(printf '%s' "${PH_ADMIN_PASS}" | base64 -w0)"
          # Crawler knobs: simple values pass through; feed lists are base64-wrapped
          # (the container decodes *_FEEDS_B64). Defaults keep an unset var safe.
          PH_CRAWL_ENABLED="${PH_CRAWL_ENABLED:-0}"
          PH_CRAWL_INTERVAL_SECS="${PH_CRAWL_INTERVAL_SECS:-}"
          PH_CRAWL_CASELAW_FEEDS_B64="$(printf '%s' "${PH_CRAWL_CASELAW_FEEDS:-}" | base64 -w0)"
          PH_CRAWL_NEWS_FEEDS_B64="$(printf '%s' "${PH_CRAWL_NEWS_FEEDS:-}" | base64 -w0)"
          PH_CRAWL_COURTWATCH_FEEDS_B64="$(printf '%s' "${PH_CRAWL_COURTWATCH_FEEDS:-}" | base64 -w0)"
          # AI knobs (simple values — no special chars). OFF unless the repo var is 1.
          PH_AI_ENABLED="${PH_AI_ENABLED:-0}"
          PH_AI_BACKEND="${PH_AI_BACKEND:-bedrock}"
          PH_AI_MODEL="${PH_AI_MODEL:-amazon.nova-lite-v1:0}"
          # Litestream backup (off unless bucket name set; empty = disabled).
          PH_BACKUP_BUCKET="${PH_BACKUP_BUCKET:-}"
          DEPLOY_AWS_REGION="${DEPLOY_AWS_REGION:-eu-west-2}"
          # Bind loopback-only (127.0.0.1:8090) so the port is NOT exposed to the
          # network — only the edge Caddy on the same host reaches it. A /data
          # volume is mounted for forward-compat (future CMS db + uploaded media).
          cat > params.json <<JSON
          {"commands":[
            "set -eu",
            "echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin",
            "docker pull '${REF}'",
            "mkdir -p /var/lib/ph-press/uploads && chmod 700 /var/lib/ph-press",
            "docker network create ph-net 2>/dev/null || true",
            "docker rm -f ph-press || true",
            "docker run -d --name ph-press --restart unless-stopped --network ph-net -p 127.0.0.1:8090:8090 -v /var/lib/ph-press:/data -e PH_ADMIN_USER='${PH_ADMIN_USER}' -e PH_ADMIN_PASS_B64='${PH_ADMIN_PASS_B64}' -e PH_ADMIN_RESET='${PH_ADMIN_RESET}' -e PH_ADMIN_EMAIL='${PH_ADMIN_EMAIL}' -e PH_EMAIL_BACKEND='${PH_EMAIL_BACKEND}' -e PH_EMAIL_FROM_B64='${PH_EMAIL_FROM_B64}' -e PH_CRAWL_ENABLED='${PH_CRAWL_ENABLED}' -e PH_CRAWL_INTERVAL_SECS='${PH_CRAWL_INTERVAL_SECS}' -e PH_CRAWL_CASELAW_FEEDS_B64='${PH_CRAWL_CASELAW_FEEDS_B64}' -e PH_CRAWL_NEWS_FEEDS_B64='${PH_CRAWL_NEWS_FEEDS_B64}' -e PH_CRAWL_COURTWATCH_FEEDS_B64='${PH_CRAWL_COURTWATCH_FEEDS_B64}' -e PH_AI_ENABLED='${PH_AI_ENABLED}' -e PH_AI_BACKEND='${PH_AI_BACKEND}' -e PH_AI_MODEL='${PH_AI_MODEL}' -e PH_BACKUP_BUCKET='${PH_BACKUP_BUCKET}' -e AWS_REGION='${DEPLOY_AWS_REGION}' '${REF}'",
            "sleep 8",
            "docker ps --filter name=ph-press --format '{{.Status}}' | grep -q Up || { docker logs --tail 80 ph-press; exit 1; }",
            "curl -fsS http://127.0.0.1:8090/healthz || { docker logs --tail 80 ph-press; exit 1; }",
            "docker logout ghcr.io || true",
            "docker image prune -f || true"
          ]}
          JSON
          CID=$(aws ssm send-command --instance-ids "$IID" \
            --document-name AWS-RunShellScript --comment "ph-press redeploy (pull)" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command: $CID"
          for i in $(seq 1 36); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $ST"
            case "$ST" in
              Success) break;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM redeploy $ST"
                aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardErrorContent --output text
                exit 1;;
            esac
            sleep 10
          done
          [ "$ST" = "Success" ] || { echo "::error::SSM redeploy timed out (last: $ST)"; exit 1; }
          echo "=== output ==="
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
