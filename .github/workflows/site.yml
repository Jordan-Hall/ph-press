name: site

# Build the Predator Hunters main-site image (predatorhunters.co.uk) in CI, push
# to GHCR, then have the EC2 box docker-PULL + run it via AWS SSM (same no-SSH
# pattern as the research site). The box only RUNS the prebuilt image.
#
# This container serves the SSG site over PLAIN HTTP on :8090. It joins the
# shared user-defined Docker network `ph-net`; TLS for the apex is terminated by
# the shared EDGE Caddy (the research-site container, also on `ph-net`, which owns
# :443 + the Let's Encrypt cert and reverse-proxies predatorhunters.co.uk to
# `ph-press:8090` over that network — NOT 127.0.0.1, which inside a bridge-mode
# container is the container itself). So this deploy needs no Cloudflare token and
# opens no new firewall port (the loopback publish is only for the healthz probe).
#
# Gated on the GitHub Environment `production`. Reuses the same deploy secrets/vars
# as the bulwark server + research site:
#   secret AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (ph-bulwark-deployer; ssm:SendCommand)
#   var    AWS_REGION         e.g. eu-west-2
#   var    AWS_INSTANCE_ID    the EC2 instance id (SSM-managed)
#
# ONE-TIME prerequisites (outside CI — see deploy/README.md):
#   * In THIS repo: create the `production` Environment + add the AWS secrets/vars above.
#   * Cloudflare: proxied A records `@` (apex) and `www` → box IP (35.179.110.106).
#   * Edge: the research Caddyfile gains a `predatorhunters.co.uk` block that
#     reverse-proxies to 127.0.0.1:8090 (shipped in child-safety deploy/research).

on:
  push:
    branches: [master]
    paths:
      - src/**
      - content/**
      - assets/**
      - deploy/**
      - index.html
      - Cargo.toml
      - Cargo.lock
      - Dioxus.toml
      - .github/workflows/site.yml
  workflow_dispatch: {}

concurrency:
  group: deploy-ph-press
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jordan-hall/ph-press

jobs:
  build-image:
    name: build + push ph-press image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the SSG bundle into a Caddy image
        run: |
          set -euo pipefail
          docker build -f deploy/Dockerfile \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
      - name: Smoke test — image runs + bundle is present
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE:${GITHUB_SHA}" caddy version
          docker run --rm --entrypoint sh "$IMAGE:${GITHUB_SHA}" -c 'test -f /srv/index.html && echo bundle-ok'
      - name: Push to GHCR
        run: |
          set -euo pipefail
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  deploy:
    name: redeploy ph-press via SSM (pull, no build, no SSH)
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials (scoped deploy user)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Redeploy via SSM Run Command
        env:
          IID: ${{ vars.AWS_INSTANCE_ID }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${IMAGE}:${GITHUB_SHA}"
          # Bind loopback-only (127.0.0.1:8090) so the port is NOT exposed to the
          # network — only the edge Caddy on the same host reaches it. A /data
          # volume is mounted for forward-compat (future CMS db + uploaded media).
          cat > params.json <<JSON
          {"commands":[
            "set -eu",
            "echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin",
            "docker pull '${REF}'",
            "mkdir -p /var/lib/ph-press && chmod 700 /var/lib/ph-press",
            "docker network create ph-net 2>/dev/null || true",
            "docker rm -f ph-press || true",
            "docker run -d --name ph-press --restart unless-stopped --network ph-net -p 127.0.0.1:8090:8090 -v /var/lib/ph-press:/data '${REF}'",
            "sleep 8",
            "docker ps --filter name=ph-press --format '{{.Status}}' | grep -q Up || { docker logs --tail 80 ph-press; exit 1; }",
            "curl -fsS http://127.0.0.1:8090/healthz || { docker logs --tail 80 ph-press; exit 1; }",
            "docker logout ghcr.io || true",
            "docker image prune -f || true"
          ]}
          JSON
          CID=$(aws ssm send-command --instance-ids "$IID" \
            --document-name AWS-RunShellScript --comment "ph-press redeploy (pull)" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command: $CID"
          for i in $(seq 1 36); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $ST"
            case "$ST" in
              Success) break;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM redeploy $ST"
                aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardErrorContent --output text
                exit 1;;
            esac
            sleep 10
          done
          [ "$ST" = "Success" ] || { echo "::error::SSM redeploy timed out (last: $ST)"; exit 1; }
          echo "=== output ==="
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
