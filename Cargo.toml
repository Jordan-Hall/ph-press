[package]
name = "ph-press"
version = "0.0.0"
edition = "2021"
description = "Predator Hunters — the main public site: court-reporting journalism, the public conviction database, and the editorial system. All-Rust Dioxus 0.8 (web SSG + native)."
publish = false

# One Dioxus 0.8 codebase, no webviews. The `web` build is wasm + SSG (the
# crawlable, shareable public site — the primary surface). `desktop`/`mobile`
# render the same RSX via dioxus-native (Blitz) for the cross-platform apps.
[features]
default = ["web"]
web = ["dioxus/web"]
# server pulls the CMS (sqlx/SQLite) — SERVER-ONLY, never in the wasm/web build.
server = ["dioxus/server", "dep:ph-cms", "dep:tokio", "dep:serde_json"]
# native targets (experimental — Blitz is alpha): wired in WS4
# desktop = ["dioxus/desktop"]
# mobile  = ["dioxus/mobile"]

[dependencies]
dioxus = { version = "0.8.0-alpha.0", features = ["router", "fullstack"] }
# serde derive for the #[server] DTOs (DeskSession/DeskArticle) — needed on BOTH
# targets (the client deserializes the responses), so it is a direct, non-optional
# dep. serde itself is tiny on wasm; only sqlx/CMS stays server-gated.
serde = { version = "1", features = ["derive"] }
# Native-Rust WYSIWYG editor (taino-edit) Dioxus-0.8 adapter for the /desk editor.
# Non-optional (the editor renders on web AND is pre-rendered as an empty host by
# the SSG/native build); the web-sys editor itself is target-gated to wasm32.
taino-edit-dx = { path = "crates/taino-edit-dx" }
# Editorial CMS (SQLite). Optional + only enabled by the `server` feature, so the
# wasm/web build never tries to compile sqlx.
ph-cms = { path = "crates/ph-cms", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
serde_json = { version = "1", optional = true }

# Standalone repo (PH Press) — owns its tree. Backend crates (ph-cms,
# ph-offender) join as members as WS2/WS3 land. These are server-side only and
# are NOT pulled into the wasm/web build (kept off the default feature path).
[workspace]
members = ["crates/ph-audit", "crates/ph-cms", "crates/taino-edit-dx"]
